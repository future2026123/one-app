<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0a0a"><meta name="apple-mobile-web-app-capable" content="yes">
<title>ONE</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0a;--sf:#141414;--bd:#2a2a2a;--tx:#f0f0f0;--ts:#aaa;--ac:#fff;--rv:#e8b931;--dn:#4ade80;--fl:#f87171;--r:16px}
html,body{height:100%;font-family:'Noto Sans KR',-apple-system,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
body{display:flex;align-items:center;justify-content:center;padding:24px 24px 80px;overflow-x:hidden;overflow-y:auto}
.app{width:100%;max-width:420px;text-align:center;position:relative}
.screen{display:none;animation:fi .4s ease}.screen.active{display:block}
@keyframes fi{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.hero-text{font-size:28px;font-weight:900;line-height:1.4;letter-spacing:-.5px;margin-bottom:48px}
.hero-sub{font-size:14px;color:var(--ts);margin-top:8px;font-weight:300}
.input-group{margin-bottom:20px}
.task-input{width:100%;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:18px 20px;font-size:17px;color:var(--tx);font-family:inherit;outline:none;transition:border-color .2s}
.task-input::placeholder{color:#666}.task-input:focus{border-color:#555}
.rc{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:32px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.rc input[type=checkbox]{appearance:none;width:20px;height:20px;border:2px solid #555;border-radius:6px;background:transparent;cursor:pointer;position:relative;transition:all .2s;flex-shrink:0}
.rc input:checked{background:var(--rv);border-color:var(--rv)}
.rc input:checked::after{content:'\2713';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:13px;color:#000;font-weight:700}
.rc span{font-size:14px;color:var(--ts);user-select:none}
.btn{width:100%;padding:18px;border:none;border-radius:var(--r);font-size:17px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .2s;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.97)}
.bp{background:var(--ac);color:#000}.bp:disabled{background:#333;color:#666;cursor:not-allowed;transform:none}
.bs{background:var(--ac);color:#000}.bd{background:var(--dn);color:#000}
.bfr{background:var(--sf);color:var(--tx);border:1px solid var(--bd)}
.bsc{background:transparent;color:var(--ts);font-size:14px;font-weight:400;padding:12px;margin-top:8px}.bsc:hover{color:var(--tx)}
.td{font-size:26px;font-weight:700;line-height:1.5;margin-bottom:12px;word-break:keep-all}
.rt{display:inline-block;font-size:12px;font-weight:500;color:var(--rv);border:1px solid var(--rv);border-radius:100px;padding:4px 14px;margin-bottom:40px}
.sl{font-size:13px;color:var(--ts);margin-bottom:32px;letter-spacing:2px;text-transform:uppercase}
.bg{display:flex;flex-direction:column;gap:0}.ri{font-size:48px;margin-bottom:24px}.rxt{font-size:24px;font-weight:700;margin-bottom:8px}.rs{font-size:14px;color:var(--ts);font-weight:300;margin-bottom:24px}.rtr{font-size:14px;color:#888;text-decoration:line-through;margin-bottom:32px}
.ec{margin-top:24px;padding:20px;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r)}.ec p{font-size:13px;color:var(--ts);margin-bottom:12px}
.er{display:flex;gap:8px}.er input{flex:1;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--tx);font-family:inherit;outline:none}.er input::placeholder{color:#666}
.er button{background:var(--ac);color:#000;border:none;border-radius:10px;padding:12px 16px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap}
.es{font-size:13px;color:var(--dn);margin-top:12px;display:none}
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center;padding:24px;animation:fi .2s ease}.mo.active{display:flex}
.ml{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:28px 24px;width:100%;max-width:400px}
.mt{font-size:16px;font-weight:700;margin-bottom:6px}.mw{font-size:13px;color:var(--fl);margin-bottom:20px}.ml .task-input{margin-bottom:16px}
.mb{display:flex;gap:10px}.mb .btn{flex:1;padding:14px;font-size:15px}.bc{background:transparent;color:var(--ts);border:1px solid var(--bd)}
.apo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:center;justify-content:center;padding:24px}.apo.active{display:flex}
.ap{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:32px 24px;width:100%;max-width:360px;text-align:center}
.apt{font-size:18px;font-weight:700;margin-bottom:8px}.apd{font-size:14px;color:var(--ts);margin-bottom:24px}.ap .btn{margin-bottom:8px}
.bra{background:var(--rv);color:#000}.bnn{background:transparent;color:var(--ts);font-size:14px;font-weight:400;padding:12px}
.ab{position:fixed;bottom:0;left:0;right:0;background:var(--sf);border-top:1px solid var(--bd);padding:12px 20px;text-align:center;z-index:50;display:flex;align-items:center;justify-content:center;gap:8px}
.ab.hidden{display:none}.ab a{color:var(--ts);text-decoration:none;font-size:13px;transition:color .2s}.ab a:hover{color:var(--tx)}
.abl{font-size:10px;color:#777;text-transform:uppercase;letter-spacing:1px}
.dd{position:fixed;bottom:56px;left:50%;transform:translateX(-50%);font-size:12px;color:#666;letter-spacing:1px;transition:bottom .2s}.dd.nb{bottom:20px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}.pulse{animation:pulse 2s ease-in-out infinite}
@keyframes cBurst{0%{transform:scale(0.2) rotate(-30deg);opacity:0}55%{transform:scale(1.6) rotate(12deg);opacity:1}75%{transform:scale(0.88) rotate(-4deg)}100%{transform:scale(1) rotate(0deg)}}
@keyframes cGlow{0%,100%{text-shadow:0 0 20px rgba(74,222,128,.15)}50%{text-shadow:0 0 40px rgba(74,222,128,1),0 0 90px rgba(232,185,49,.7),0 0 160px rgba(74,222,128,.35)}}
@keyframes cSpin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes cSlide{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes ringPop{0%{transform:translate(-50%,-50%) scale(0);opacity:.9}100%{transform:translate(-50%,-50%) scale(6);opacity:0}}
#sd.celebrate .ri{animation:cBurst .7s cubic-bezier(.34,1.56,.64,1) both,cGlow 2s ease .7s infinite;display:inline-block}
#sd.celebrate .rxt{animation:cSlide .55s cubic-bezier(.34,1.56,.64,1) .12s both}
#sd.celebrate .rs{animation:cSlide .5s ease .28s both}
#sd.celebrate .rtr{animation:cSlide .45s ease .42s both}
#sd.celebrate .ec{animation:cSlide .45s ease .55s both}
.cring{position:fixed;width:70px;height:70px;border-radius:50%;border:2px solid;pointer-events:none;z-index:995;animation:ringPop .85s ease-out forwards}
.stt{margin-top:48px;font-size:12px;color:#777;letter-spacing:.5px;min-height:16px}
.bkb{display:flex;align-items:center;justify-content:center;gap:20px;margin-top:12px}
.bkbtn{background:none;border:none;color:#666;font-size:12px;font-family:inherit;cursor:pointer;padding:4px 0;transition:color .2s;letter-spacing:.3px}
.bkbtn:hover{color:#aaa}
.hmo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:150;align-items:flex-end;justify-content:center;padding:0;animation:fi .2s ease}.hmo.active{display:flex}
.hpn{background:#111;border-top:1px solid var(--bd);border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:80vh;display:flex;flex-direction:column;animation:slideUp .3s cubic-bezier(.34,1.2,.64,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.hph{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 12px;border-bottom:1px solid #1e1e1e;flex-shrink:0}
.hpt{font-size:15px;font-weight:700}.hpc{background:none;border:none;color:#888;font-size:22px;cursor:pointer;line-height:1;padding:0 4px}
.hpc:hover{color:#ccc}
.hls{overflow-y:auto;padding:8px 0 24px}
.hli{display:flex;align-items:center;gap:14px;padding:13px 20px;border-bottom:1px solid #161616}
.hli:last-child{border-bottom:none}
.hst{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.hst.dn{background:rgba(74,222,128,.15);color:var(--dn)}.hst.fl{background:rgba(248,113,113,.1);color:var(--fl)}
.hdt{font-size:11px;color:#888;flex-shrink:0;width:68px}
.htx{font-size:14px;color:#e0e0e0;flex:1;text-align:left;word-break:keep-all;line-height:1.4}
.hem{padding:40px 20px;text-align:center;font-size:14px;color:#777}
</style></head><body>
<div class="app">
<div id="se" class="screen"><div class="hero-text">오늘,<br>하나만 하면 된다<div class="hero-sub">나머지는 버려도 된다</div></div>
<div class="input-group"><input type="text" id="ti" class="task-input" placeholder="오늘 가장 중요한 1개" maxlength="100" autocomplete="off"></div>

<div class="ec" id="ecl"><p>새 앱 출시 소식을 받으시겠습니까?</p><div class="er"><input type="email" id="ei" placeholder="your@email.com"><button id="bn">알림</button></div><div class="es" id="esn">감사합니다!</div></div>

</div></div>

<input type="text" id="edi" class="task-input" maxlength="100" autocomplete="off"><div class="mb"><button class="btn bc" id="bec">취소</button><button class="btn bp" id="bes">변경</button></div></div></div>
<div class="apo" id="apo"><div class="ap"><div class="apt">Enjoying ONE?</div><div class="apd">Go ad-free for $1.99</div>
<button class="btn bra" id="bra">Remove Ads — $1.99</button><button class="btn bnn" id="bnn">Not now</button></div></div>
<div class="ab" id="ab"><span class="abl">by SystemLab</span><a href="#" id="cpl">Try our other apps →</a></div>
<div class="dd" id="ddp"></div>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id),today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},SK='one_data';
(function(){const p=new URLSearchParams(location.search);if(p.get('admin')==='systemlab'){localStorage.setItem('paid','true');history.replaceState({},'',location.pathname)}})();
(function(){const p=new URLSearchParams(location.search);if(p.get('paid')==='true'){localStorage.setItem('paid','true');history.replaceState({},'',location.pathname)}})();
const isPaid=()=>localStorage.getItem('paid')==='true';
function incUse(){const n=parseInt(localStorage.getItem('useCount')||'0',10);localStorage.setItem('useCount',String(n+1));return n+1}
function getUse(){return parseInt(localStorage.getItem('useCount')||'0',10)}
function updateAd(){const b=$('ab'),d=$('ddp');if(isPaid()){b.classList.add('hidden');d.classList.add('nb');document.body.style.paddingBottom='24px'}else{b.classList.remove('hidden');d.classList.remove('nb');document.body.style.paddingBottom='80px'}}
function maybeAd(){if(isPaid())return;const c=getUse();if(c>0&&c%3===0)$('apo').classList.add('active')}

// 데이터 마이그레이션 (구버전 ONE_TASK → one_data)
function migrate(){
  if(localStorage.getItem(SK))return;
  const old=localStorage.getItem('ONE_TASK');
  if(!old)return;
  try{
    const d=JSON.parse(old);
    if(d&&d.task){
      localStorage.setItem(SK,JSON.stringify({current:{date:d.date,text:d.task.text,status:d.task.status,isRevenue:!!d.task.isRevenue,edited:!!d.task.edited},history:[]}));
      localStorage.removeItem('ONE_TASK');
    }
  }catch{}
}

function load(){
  try{
    const r=localStorage.getItem(SK);
    if(!r)return{current:null,history:[]};
    const d=JSON.parse(r);
    if(typeof d!=='object'||d===null)return{current:null,history:[]};
    if(!Array.isArray(d.history))d.history=[];
    return d;
  }catch{return{current:null,history:[]}}
}
function save(d){localStorage.setItem(SK,JSON.stringify(d))}

function archiveToHistory(data){
  const c=data.current;
  if(!c)return;
  const exists=data.history.some(h=>h.date===c.date);
  if(!exists){
    data.history.push({date:c.date,text:c.text,status:c.status,isRevenue:!!c.isRevenue});
  }
}

function calcStreak(history){
  let count=0;
  for(let i=history.length-1;i>=0;i--){
    if(history[i].status==='done')count++;
    else break;
  }
  return count;
}

function calcTotal(history){
  return history.filter(h=>h.status==='done').length;
}

function updateStats(data){
  const el=$('stt');
  const streak=calcStreak(data.history);
  const total=calcTotal(data.history);
  const parts=[];
  if(streak>0)parts.push(streak+'일 연속 성공');
  if(total>0)parts.push('총 성공 '+total+'일');
  el.textContent=parts.join(' · ');
}

const screens=['se','si','sp','sd','sf'];
function show(id){screens.forEach(s=>$(s).classList.remove('active'));requestAnimationFrame(()=>$(id).classList.add('active'))}
function updateDate(){const d=new Date(),days=['일','월','화','수','목','금','토'];$('ddp').textContent=d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')+' '+days[d.getDay()]}

function render(){
  updateDate();updateAd();
  const data=load();

  // 날짜 바뀐 경우 처리
  if(data.current&&data.current.date!==today()){
    if(data.current.status!=='done')data.current.status='failed';
    archiveToHistory(data);
    if(data.current.status==='done'){
      data.current=null;
    }
    // failed는 current 유지 → failed 화면 표시 후 유저가 "다시 시작" 클릭
    save(data);
  }

  updateStats(data);

  if(!data.current){
    show('se');$('ti').value='';$('rc').checked=false;$('bc').disabled=true;return;
  }
  const t=data.current;
  switch(t.status){
    case'idle':
      $('dt').textContent=t.text;$('rvt').style.display=t.isRevenue?'':'none';
      $('be').style.display=t.edited?'none':'';show('si');break;
    case'in_progress':
      $('dtp').textContent=t.text;$('rvtp').style.display=t.isRevenue?'':'none';show('sp');break;
    case'done':
      $('dr').textContent=t.text;
      if(localStorage.getItem('emailSubmitted')==='true')$('ecl').style.display='none';
      show('sd');break;
    case'failed':
      $('fr').textContent=t.text;show('sf');break;
  }
}

// 축하 애니메이션
function celebrate(){
  const sd=$('sd');
  sd.classList.remove('celebrate');
  void sd.offsetWidth;
  sd.classList.add('celebrate');

  // 화면 플래시
  const flash=document.createElement('div');
  flash.style.cssText='position:fixed;inset:0;background:#fff;opacity:0;z-index:999;pointer-events:none;transition:opacity .07s ease';
  document.body.appendChild(flash);
  requestAnimationFrame(()=>{
    flash.style.opacity='.15';
    setTimeout(()=>{flash.style.transition='opacity .4s ease';flash.style.opacity='0';setTimeout(()=>flash.remove(),420)},70);
  });

  // 확장 링 3개
  const ringC=['rgba(74,222,128,.7)','rgba(232,185,49,.6)','rgba(255,255,255,.5)'];
  for(let i=0;i<3;i++){
    setTimeout(()=>{
      const r=document.createElement('div');
      r.className='cring';
      r.style.cssText+=`top:50%;left:50%;border-color:${ringC[i]};animation-delay:0s`;
      document.body.appendChild(r);
      setTimeout(()=>r.remove(),900);
    },i*110);
  }

  // 컨페티 캔버스
  const canvas=document.createElement('canvas');
  canvas.style.cssText='position:fixed;top:0;left:0;z-index:994;pointer-events:none';
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
  document.body.appendChild(canvas);
  const ctx=canvas.getContext('2d');
  const cols=['#4ade80','#86efac','#22c55e','#e8b931','#fde68a','#f59e0b','#ffffff','#f0f0f0','#a3e635','#34d399'];
  const ps=[];
  const cx=canvas.width/2, cy=canvas.height*.44;
  for(let i=0;i<150;i++){
    const angle=Math.random()*Math.PI*2;
    const spd=7+Math.random()*15;
    const sh=Math.random()<.45?'ribbon':(Math.random()<.55?'rect':'circle');
    ps.push({
      x:cx+(Math.random()-.5)*20, y:cy,
      vx:Math.cos(angle)*spd*.95,
      vy:Math.sin(angle)*spd-Math.random()*8,
      w:sh==='ribbon'?2+Math.random()*2:5+Math.random()*5,
      h:sh==='ribbon'?9+Math.random()*9:sh==='rect'?4+Math.random()*5:0,
      rad:sh==='circle'?2.5+Math.random()*3.5:0,
      col:cols[Math.floor(Math.random()*cols.length)],
      rot:Math.random()*Math.PI*2,
      rotV:(Math.random()-.5)*.28,
      alpha:1, sh,
      delay:Math.floor(Math.random()*18),
      g:.32+Math.random()*.22,
      drag:.968+Math.random()*.018
    });
  }

  let frame=0;
  const maxF=170;
  function tick(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(const p of ps){
      if(frame<p.delay)continue;
      p.vx*=p.drag; p.vy+=p.g; p.vy*=p.drag;
      p.x+=p.vx; p.y+=p.vy; p.rot+=p.rotV;
      if(frame>95)p.alpha=Math.max(0,p.alpha-.02);
      ctx.save();
      ctx.globalAlpha=p.alpha;
      ctx.fillStyle=p.col;
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rot);
      if(p.sh==='circle'){ctx.beginPath();ctx.arc(0,0,p.rad,0,Math.PI*2);ctx.fill();}
      else ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    }
    frame++;
    if(frame<maxF)requestAnimationFrame(tick);
    else canvas.remove();
  }
  tick();
  setTimeout(()=>sd.classList.remove('celebrate'),3600);
}

// 백업 Export
function exportData(){
  const data=load();
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const d=new Date();
  const ds=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  a.href=url;a.download='one_backup_'+ds+'.json';a.click();
  URL.revokeObjectURL(url);
}

// 복구 Import
function importData(file){
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const d=JSON.parse(e.target.result);
      if(typeof d!=='object'||d===null||!Array.isArray(d.history))throw new Error();
      localStorage.setItem(SK,JSON.stringify(d));
      render();
    }catch{
      alert('파일을 읽을 수 없습니다.\n올바른 백업 파일인지 확인하세요.');
    }
  };
  reader.readAsText(file);
}

function openHistory(){
  const data=load();
  const list=[...data.history].reverse();
  const el=$('hls');
  if(list.length===0){el.innerHTML='<div class="hem">아직 기록이 없어요</div>';}
  else{
    el.innerHTML=list.map(h=>{
      const isDone=h.status==='done';
      const icon=isDone?'✓':'✕';
      const cls=isDone?'dn':'fl';
      // YYYY-MM-DD → MM/DD
      const dp=h.date.slice(5).replace('-','/');
      return `<div class="hli"><span class="hst ${cls}">${icon}</span><span class="hdt">${dp}</span><span class="htx">${h.text}</span></div>`;
    }).join('');
  }
  $('hmo').classList.add('active');
}
